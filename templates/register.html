<!DOCTYPE html>
<html>
<head>

<title>Register</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<style>


*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}


body{
height:100vh;
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
display:flex;
justify-content:center;
align-items:center;
color:#333;
overflow-x:hidden;
}


/* floating background animation */


body::before{
content:"";
position:absolute;
width:600px;
height:600px;
background:rgba(255,255,255,0.05);
border-radius:50%;
top:-200px;
left:-200px;
animation:float 8s infinite alternate ease-in-out;
}


body::after{
content:"";
position:absolute;
width:500px;
height:500px;
background:rgba(255,255,255,0.05);
border-radius:50%;
bottom:-150px;
right:-150px;
animation:float 10s infinite alternate ease-in-out;
}


@keyframes float{
from{transform:translateY(0px)}
to{transform:translateY(40px)}
}


.container{


width:760px;
background:rgba(255,255,255,0.95);
backdrop-filter:blur(10px);
padding:40px;
border-radius:18px;
box-shadow:0 30px 60px rgba(0,0,0,0.35);
animation:fadeIn 1s ease;
}


@keyframes fadeIn{
from{opacity:0;transform:translateY(30px)}
to{opacity:1;transform:translateY(0)}
}


h2{
text-align:center;
margin-bottom:30px;
color:#2c5364;
font-size:30px;
font-weight:600;
}


/* form */


.form-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
margin-bottom:10px;
}


input,select{


padding:14px;
border-radius:10px;
border:1px solid #ddd;
font-size:14px;
transition:0.3s;
background:#f9fbff;


}


input:focus,select:focus{


border-color:#2c5364;
box-shadow:0 0 10px rgba(44,83,100,0.25);
outline:none;
transform:scale(1.02);


}


/* buttons */


.button-group{
text-align:center;
margin-top:25px;
}


button{


padding:12px 28px;
border:none;
border-radius:30px;
font-size:14px;
cursor:pointer;
margin:6px;
font-weight:500;
letter-spacing:0.5px;
transition:0.3s;


}


.predict-btn{
background:linear-gradient(135deg,#2c5364,#203a43);
color:white;
}


.predict-btn:hover{
transform:translateY(-3px);
box-shadow:0 10px 25px rgba(0,0,0,0.25);
}


.dashboard-btn{
background:#f1f5ff;
color:#2c5364;
}


.dashboard-btn:hover{
background:#e0e9ff;
}


/* result box */


.result-box{


margin-top:35px;
padding:25px;
background:#f7faff;
border-radius:15px;
box-shadow:0 10px 25px rgba(0,0,0,0.08);
animation:slideUp 0.6s ease;


}


@keyframes slideUp{
from{opacity:0;transform:translateY(25px)}
to{opacity:1;transform:translateY(0)}
}


.result-box h3{
color:#2c5364;
margin-bottom:15px;
}


/* analytics cards */


.analytics{
display:grid;
grid-template-columns:1fr 1fr;
gap:18px;
margin-top:15px;
}


.card{


background:white;
border-radius:12px;
padding:18px;
box-shadow:0 8px 20px rgba(0,0,0,0.08);
text-align:center;
transition:0.3s;


}


.card:hover{
transform:translateY(-6px);
box-shadow:0 15px 30px rgba(0,0,0,0.12);
}


.card strong{
color:#777;
font-size:13px;
display:block;
margin-bottom:6px;
}


.card span{
font-size:22px;
font-weight:600;
color:#203a43;
}


/* sections */


.optimal,.competitor,.forecast{


margin-top:20px;
padding:18px;
border-radius:12px;
animation:fadeIn 0.7s ease;


}


.optimal{
background:#e9f8ee;
border-left:5px solid #27ae60;
}


.competitor{
background:#fff4e8;
border-left:5px solid #f39c12;
}


.forecast{
background:#edf3ff;
border-left:5px solid #3f6df6;
}


.optimal h3,.competitor h3,.forecast h3{
margin-bottom:8px;
color:#203a43;
}
</style>
</head>

<body>
<nav style="
position:fixed;
top:0;
left:0;
width:100%;
background:rgba(0,0,0,0.6);
backdrop-filter:blur(10px);
padding:12px 40px;
display:flex;
justify-content:space-between;
align-items:center;
z-index:1000;
">

  <!-- Logo -->
  <div style="color:white; font-weight:600; font-size:18px;">
    Dynamic Pricing
  </div>

  <!-- Links -->
  <div>
    <a href="/" style="color:white; margin:0 10px; text-decoration:none;">Home</a>

    {% if not session.get('user') %}
      <a href="/login" style="color:white; margin:0 10px; text-decoration:none;">Login</a>
      <a href="/register" style="color:white; margin:0 10px; text-decoration:none;">Register</a>
    {% else %}
      <a href="/logout" style="color:#ff4d4d; margin:0 10px; text-decoration:none;">Logout</a>
    {% endif %}
  </div>

</nav>
<div class="container">

<h2>Create Account 
</h2>
{% if error %}
<p style="color:red; text-align:center; margin-bottom:15px;">
  {{ error }}
</p>
{% endif %}

<form method="POST">

<div class="form-grid">

<input type="text" name="name" placeholder="Employee Name" required>
<input type="email" name="email" placeholder="Email" required>
<input type="password" name="password" placeholder="Password" required>
<input type="password" name="confirm_password" placeholder="Confirm Password" required>

</div>

<div class="button-group">

<button type="submit" class="predict-btn">Register</button>

<a href="/login">
<button type="button" class="dashboard-btn">Login</button>
</a>

</div>

</form>

</div>

</body>
</html>
